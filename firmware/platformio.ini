; Desk Gaby: firmware for the Waveshare ESP32-S3-Touch-LCD-4B.
;
; Arduino core 3.x is needed (Waveshare's demos require >= 3.2), and
; PlatformIO's own espressif32 platform stops at core 2.x, so this uses the
; community "pioarduino" platform. Every version is pinned, so a build today
; and a build next year produce the same firmware.

[env:gaby]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM.
; The 480x480 frame buffer (450 KB) lives in PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial over the chip's own USB port (the one plugged in), no UART adapter needed.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL reads include/lv_conf.h.
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    ; Waveshare ships 1.6.0, which doesn't compile against core 3.3's SPI API.
    moononournation/GFX Library for Arduino@1.6.9
    lvgl/lvgl@9.3.0
    lewisxhe/SensorLib@0.3.1
    bblanchon/ArduinoJson@7.4.3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
