# ---- Server ----
# 8085: other local projects already hold 8080 and 8081 on this machine.
server.port=${PORT:8085}

# ---- PostgreSQL ----
# Local dev defaults match docker-compose.yml at the repo root
# (docker compose up -d db). Production overrides all three via
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5434/krugworld
spring.datasource.username=krugworld
spring.datasource.password=krugworld

# ---- JPA ----
# Flyway creates and changes tables; Hibernate only checks that the entity
# classes match what Flyway built, and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Sessions and cookies ----
# Behind nginx/Caddy: trust X-Forwarded-Proto so the app knows it's on HTTPS
# (that also makes the remember-me cookie Secure).
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true in production (SERVER_SERVLET_SESSION_COOKIE_SECURE=true): HTTPS only.
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30d

# ---- Dates ----
# "Today", month boundaries and streaks follow this zone, not the server's.
krugworld.zone=${KRUGWORLD_ZONE:Asia/Kuala_Lumpur}

# ---- The Steward (AI helper) ----
# Which provider answers: "anthropic" (Claude) or "openai". With no key set,
# the Steward tab says it's unavailable instead of failing.
krugworld.steward.provider=${KRUGWORLD_STEWARD_PROVIDER:anthropic}
krugworld.steward.anthropic.api-key=${ANTHROPIC_API_KEY:}
krugworld.steward.anthropic.model=${KRUGWORLD_STEWARD_MODEL:claude-opus-5-5}
krugworld.steward.anthropic.effort=${KRUGWORLD_STEWARD_EFFORT:low}
krugworld.steward.openai.api-key=${OPENAI_API_KEY:}
krugworld.steward.openai.model=${KRUGWORLD_STEWARD_OPENAI_MODEL:gpt-4o}
# Spend guards: a server-held key plus open registration needs a cap.
krugworld.steward.daily-limit-per-user=${KRUGWORLD_STEWARD_DAILY_LIMIT:40}
krugworld.steward.daily-limit-global=${KRUGWORLD_STEWARD_GLOBAL_DAILY_LIMIT:400}
krugworld.steward.max-message-chars=1000
krugworld.steward.history-turns=12

# ---- Health ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
