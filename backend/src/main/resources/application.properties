# ---- Server ----
# 8085: other local projects already hold 8080 and 8081 on this machine.
server.port=${PORT:8085}

# ---- PostgreSQL ----
# Local dev defaults match docker-compose.yml at the repo root
# (docker compose up -d db). Production overrides all three via
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5434/krugworld
spring.datasource.username=krugworld
spring.datasource.password=krugworld

# ---- JPA ----
# Flyway creates and changes tables; Hibernate only checks that the entity
# classes match what Flyway built, and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Sessions and cookies ----
# Behind nginx/Caddy: trust X-Forwarded-Proto so the app knows it's on HTTPS
# (that also makes the remember-me cookie Secure).
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true in production (SERVER_SERVLET_SESSION_COOKIE_SECURE=true): HTTPS only.
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30d

# ---- Email (password reset) ----
# Mail is sent through whatever SMTP server SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD
# name; with none set, "forgot password" says it isn't available. MAIL_FROM must
# be an address that server lets you send as (for Gmail, the account itself).
krugworld.mail.from=${KRUGWORLD_MAIL_FROM:}
# Where reset links point: the address people open the app at.
krugworld.public-url=${KRUGWORLD_PUBLIC_URL:http://localhost:5174}
krugworld.password-reset.ttl-minutes=30
krugworld.password-reset.cooldown-seconds=60
# Never let a dead mail server hang the sending thread.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# /actuator/health would otherwise go DOWN (and block redeploys) whenever the mail server is unreachable.
management.health.mail.enabled=false

# ---- Dates ----
# "Today", month boundaries and streaks follow this zone, not the server's.
krugworld.zone=${KRUGWORLD_ZONE:Asia/Kuala_Lumpur}

# ---- The Steward (AI helper) ----
# Which provider answers: "openai" (the default: it will also be Gaby's ears
# and voice, so one key covers everything) or "anthropic" (Claude). With no key set,
# the Steward tab says it's unavailable instead of failing.
krugworld.steward.provider=${KRUGWORLD_STEWARD_PROVIDER:openai}
krugworld.steward.anthropic.api-key=${ANTHROPIC_API_KEY:}
krugworld.steward.anthropic.model=${KRUGWORLD_STEWARD_MODEL:claude-opus-5-5}
krugworld.steward.anthropic.effort=${KRUGWORLD_STEWARD_EFFORT:low}
krugworld.steward.openai.api-key=${OPENAI_API_KEY:}
krugworld.steward.openai.model=${KRUGWORLD_STEWARD_OPENAI_MODEL:gpt-4o}
# Spend guards: a server-held key plus open registration needs a cap.
krugworld.steward.daily-limit-per-user=${KRUGWORLD_STEWARD_DAILY_LIMIT:40}
krugworld.steward.daily-limit-global=${KRUGWORLD_STEWARD_GLOBAL_DAILY_LIMIT:400}
krugworld.steward.max-message-chars=1000
# Gaby's ears and voice for the desk device (same OPENAI_API_KEY).
krugworld.steward.voice.provider=${KRUGWORLD_VOICE_PROVIDER:openai}
krugworld.steward.voice.transcribe-model=${KRUGWORLD_TRANSCRIBE_MODEL:gpt-transcribe}
# Blank = detect; "ms" forces Malay (worth trying if English-Malay mixes come out wrong).
krugworld.steward.voice.language=${KRUGWORLD_TRANSCRIBE_LANGUAGE:}
krugworld.steward.voice.speech-model=${KRUGWORLD_SPEECH_MODEL:gpt-4o-mini-tts}
krugworld.steward.voice.voice=${KRUGWORLD_SPEECH_VOICE:coral}
krugworld.steward.history-turns=12

# ---- Health ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
