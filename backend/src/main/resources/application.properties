# ---- Server ----
# 8085: other local projects already hold 8080 and 8081 on this machine.
server.port=${PORT:8085}

# ---- PostgreSQL ----
# Local dev defaults match docker-compose.yml at the repo root
# (docker compose up -d db). Production overrides all three via
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5434/coffold
spring.datasource.username=coffold
spring.datasource.password=coffold

# ---- JPA ----
# Flyway creates and changes tables; Hibernate only checks that the entity
# classes match what Flyway built, and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Health ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
