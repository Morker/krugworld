# Local development database only:  docker compose up -d db
# Bound to 127.0.0.1:5434 (5432/5433 are taken by other local projects).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: coffold
      POSTGRES_USER: coffold
      POSTGRES_PASSWORD: coffold
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - coffold-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffold -d coffold"]
      interval: 5s
      retries: 10

volumes:
  coffold-db:
