# Production: copy this folder to /opt/krugworld/ on the server, add a .env
# (see .env.example) and the jar, then run ./redeploy.sh.
#
# The app listens on 127.0.0.1 only — the host's nginx terminates HTTPS and
# proxies to it. Port 8096 avoids the other projects on the box (8080, 8090; Kerisalus took 8095).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: krugworld
      POSTGRES_USER: krugworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - krugworld-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krugworld -d krugworld"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: krugworld:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/krugworld
      SPRING_DATASOURCE_USERNAME: krugworld
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "8080"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      KRUGWORLD_ZONE: Asia/Kuala_Lumpur
      KRUGWORLD_STEWARD_PROVIDER: ${KRUGWORLD_STEWARD_PROVIDER:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Password-reset email. With SMTP_HOST empty the feature stays off and
      # "forgot password" says so (see .env.example).
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      KRUGWORLD_MAIL_FROM: ${MAIL_FROM:-}
      KRUGWORLD_PUBLIC_URL: ${PUBLIC_URL:-https://krugworld.veteryr.online}
    ports:
      - "127.0.0.1:8096:8080"

volumes:
  krugworld-db:
