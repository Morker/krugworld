# Host nginx site for KrugWorld. Copy to /etc/nginx/sites-available/krugworld,
# symlink into sites-enabled, then run:
#   sudo certbot --nginx -d krugworld.veteryr.online
# Certbot adds the 443/TLS block and the HTTP->HTTPS redirect itself.
server {
    listen 80;
    server_name krugworld.veteryr.online;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells Spring the original request was HTTPS, so cookies are Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
