# Host nginx site for KrugWorld. Copy to /etc/nginx/sites-available/krugworld,
# symlink into sites-enabled, then run:
#   sudo certbot --nginx -d krugworld.veteryr.online
# Certbot adds the 443/TLS block and the HTTP->HTTPS redirect itself.
server {
    listen 80;
    server_name krugworld.veteryr.online;

    # Desk Gaby uploads voice clips (up to ~720 KB); nginx's default cap is 1 MB.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells Spring the original request was HTTPS, so cookies are Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gaby thinks (and may call several tools) before answering.
        proxy_read_timeout 120s;
    }

    # Gaby's voice streams as it's generated: pass each chunk straight on
    # instead of buffering, or the device waits for the whole sentence.
    location /api/device/voice/speech/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
