# Runs on every push and pull request once the repo is on GitHub.
# Backend tests start a real Postgres via Testcontainers — GitHub's Ubuntu
# runners have Docker, so this works with no extra services.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      # `package` runs every test, then builds the jar with the app inside.
      - run: ./mvnw -B package
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: coffold-jar
          path: backend/target/coffold-*.jar
